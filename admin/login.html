<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:#fff;border-radius:16px;padding:48px 40px;width:400px;max-width:90vw;box-shadow:0 4px 24px rgba(0,0,0,0.08);text-align:center}
.box .logo{font-size:48px;margin-bottom:16px}
.box h2{font-size:24px;color:#1a1a2e;margin-bottom:8px}
.box .sub{font-size:14px;color:#999;margin-bottom:32px}
.box input{width:100%;height:48px;border:1px solid #e0e0e0;border-radius:8px;padding:0 16px;font-size:15px;margin-bottom:20px;outline:none;transition:.2s}
.box input:focus{border-color:#e65c3c}
.box button{width:100%;height:48px;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:.2s}
.box button:hover{opacity:.9}
.box button:disabled{opacity:.5;cursor:not-allowed}
.err{color:#e65c3c;font-size:13px;margin-top:12px;display:none}
</style>
</head>
<body>

<div class="box">
  <div class="logo">🔐</div>
  <h2>启信通管理后台</h2>
  <p class="sub">请输入管理员令牌以继续</p>
  <input id="token" type="password" placeholder="管理员令牌" autofocus>
  <button id="btn" onclick="login()">登录</button>
  <p id="err" class="err"></p>
</div>

<script>
const TOKEN_KEY = 'qxt_admin_token';

async function login() {
  const token = document.getElementById('token').value.trim();
  if (!token) { showErr('请输入令牌'); return; }

  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = '验证中…';

  try {
    const res = await fetch('/api/admin/dashboard/stats', {
      headers: { 'x-admin-token': token }
    });
    if (res.status === 401) { showErr('令牌无效'); btn.disabled = false; btn.textContent = '登录'; return; }
    localStorage.setItem(TOKEN_KEY, token);
    location = 'index.html';
  } catch(e) {
    showErr('网络错误: ' + e.message);
    btn.disabled = false; btn.textContent = '登录';
  }
}

function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg; el.style.display = 'block';
}

document.getElementById('token').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') login();
});
</script>
</body>
</html>
